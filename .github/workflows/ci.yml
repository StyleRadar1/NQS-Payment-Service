name: CI/CD App Service · ms-pagos-suscripciones

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  id-token: write

env:
  JAVA_VERSION: "21"
  JAR_NAME: pagos-suscripciones-0.0.1-SNAPSHOT.jar

jobs:
  build-and-test:
    name: Build · Tests · JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # El JKS es público (solo CA), pero se mantiene fuera del repo.
      # Se empaqueta en el JAR para que App Service lo encuentre en classpath.
      - name: Preparar truststore RabbitMQ
        env:
          RABBITMQ_TRUSTSTORE_BASE64: ${{ secrets.RABBITMQ_TRUSTSTORE_BASE64 }}
        run: |
          if [ -n "$RABBITMQ_TRUSTSTORE_BASE64" ]; then
            mkdir -p src/main/resources/certs
            echo "$RABBITMQ_TRUSTSTORE_BASE64" | base64 -d > src/main/resources/certs/rabbitmq-truststore.jks
            echo "Truststore incluido en el JAR"
          else
            echo "ADVERTENCIA: falta RABBITMQ_TRUSTSTORE_BASE64; RabbitMQ fallará en QA/PROD"
          fi

      - name: Compilar, probar y verificar cobertura
        run: mvn -B clean verify

      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: ms-pagos-jar
          path: target/${{ env.JAR_NAME }}
          retention-days: 7

  deploy-qa:
    name: Deploy QA (App Service)
    needs: build-and-test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ms-pagos-jar
          path: deploy

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Desplegar JAR en App Service QA
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_QA }}
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          package: deploy/${{ env.JAR_NAME }}

  deploy-prod:
    name: Deploy PROD (App Service)
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ms-pagos-jar
          path: deploy

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Desplegar JAR en App Service PROD
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_PROD }}
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          package: deploy/${{ env.JAR_NAME }}
