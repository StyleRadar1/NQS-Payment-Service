name: CI/CD - ms-pagos-suscripciones

on:
  push:
    branches: [ "develop", "main", "master" ]

env:
  DOCKER_IMAGE: juangv1/styleradar-ms-pagos
  RESOURCE_GROUP: rg-styleradar-pagos
  CONTAINER_APP_QA: ms-pagos-qa
  CONTAINER_APP_PROD: ms-pagos-prod

jobs:
  # 1. Pruebas y Build
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Pruebas y Empaquetado
      run: mvn -B clean verify
    - name: Subir reporte JaCoCo
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: target/site/jacoco/

  # 2. Docker Push
  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Login en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Construir y subir imagen
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.DOCKER_IMAGE }}:latest

  # 3. Deploy a QA (rama develop)
  deploy-qa:
    needs: docker-build-push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
    - name: Login en Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Desplegar en Azure Container App QA
      uses: azure/container-apps-deploy-action@v1
      with:
        resourceGroup: ${{ env.RESOURCE_GROUP }}
        containerAppName: ${{ env.CONTAINER_APP_QA }}
        imageToDeploy: ${{ env.DOCKER_IMAGE }}:latest

  # 4. Deploy a PROD (rama main/master) - Requiere aprobación
  deploy-prod:
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production # Requiere aprobación manual en GitHub
    steps:
    - name: Login en Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Desplegar en Azure Container App PROD
      uses: azure/container-apps-deploy-action@v1
      with:
        resourceGroup: ${{ env.RESOURCE_GROUP }}
        containerAppName: ${{ env.CONTAINER_APP_PROD }}
        imageToDeploy: ${{ env.DOCKER_IMAGE }}:latest