name: CI/CD Container Apps · ms-pagos-suscripciones

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: juangv1/styleradar-ms-pagos

jobs:
  build-and-push:
    name: Build · Tests · Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # El JKS es público, pero se mantiene fuera del repo.
      # Se inyecta en certs/ para que el Dockerfile lo copie a /app/certs.
      - name: Preparar truststore RabbitMQ
        env:
          RABBITMQ_TRUSTSTORE_BASE64: ${{ secrets.RABBITMQ_TRUSTSTORE_BASE64 }}
        run: |
          if [ -n "$RABBITMQ_TRUSTSTORE_BASE64" ]; then
            mkdir -p certs
            echo "$RABBITMQ_TRUSTSTORE_BASE64" | base64 -d > certs/rabbitmq-truststore.jks
            echo "JKS listo para la imagen"
          else
            echo "ADVERTENCIA: falta RABBITMQ_TRUSTSTORE_BASE64; RabbitMQ fallará"
          fi

      - name: Compilar y probar
        run: mvn -B clean verify

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy Container App
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Actualizar Container App
        run: |
          az containerapp update \
            --name "${{ secrets.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE_NAME }}:${GITHUB_SHA}"
  deploy-prod:
  name: Deploy PROD
  needs: build-and-push
  if: github.ref == 'refs/heads/master'
  runs-on: ubuntu-latest
  environment: production
  steps:
    - uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - run: |
        az containerapp update \
          --name "${{ secrets.AZURE_CONTAINER_APP_PROD }}" \
          --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
          --image "${{ env.IMAGE_NAME }}:${GITHUB_SHA}"
