name: CI/CD Pipeline - ms-pagos-suscripciones

on:
  push:
    branches: [ "develop", "master" ]
  pull_request:
    branches: [ "develop", "master" ]

jobs:
  # --- TRABAJO 1: BUILD Y PRUEBAS ---
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Ejecutar pruebas y empaquetar
      run: mvn -B clean verify

    # (Opcional) Guardar el reporte de cobertura como artefacto
    - name: Subir reporte de cobertura JaCoCo
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: target/site/jacoco/

  # --- TRABAJO 2: CONSTRUIR Y SUBIR IMAGEN DOCKER ---
  build-and-push-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Solo hacer push si estamos en las ramas principales (no en PRs)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
    
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Iniciar sesión en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Construir y subir la imagen Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # Etiquetamos la imagen con la rama y el hash del commit para tener trazabilidad
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/styleradar-ms-pagos:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/styleradar-ms-pagos:${{ github.sha }}
        # Caché para acelerar futuros builds
        cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/styleradar-ms-pagos:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/styleradar-ms-pagos:buildcache,mode=max