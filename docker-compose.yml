version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: styleradar-postgres
    environment:
      POSTGRES_DB: styleradar_pagos
      POSTGRES_USER: sr_user
      POSTGRES_PASSWORD: sr_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: styleradar-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: styleradar-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  pgdata: