services:
  # Base de datos PostgreSQL para Pagos
  postgres-pagos:
    image: postgres:16-alpine
    container_name: sr-postgres-pagos
    environment:
      POSTGRES_DB: styleradar_pagos
      POSTGRES_USER: sr_user
      POSTGRES_PASSWORD: sr_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata_pagos:/var/lib/postgresql/data
    networks:
      - sr-network

  # Redis para Locks de Idempotencia
  redis-pagos:
    image: redis:7-alpine
    container_name: sr-redis-pagos
    ports:
      - "6379:6379"
    networks:
      - sr-network

  # Microservicio de Pagos
  ms-pagos-suscripciones:
    build: .
    container_name: sr-ms-pagos
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-pagos:5432/styleradar_pagos
      - SPRING_DATASOURCE_USERNAME=sr_user
      - SPRING_DATASOURCE_PASSWORD=sr_password
      - SPRING_DATA_REDIS_HOST=redis-pagos
      - SPRING_DATA_REDIS_PORT=6379
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN} # Se inyecta desde .env
    depends_on:
      - postgres-pagos
      - redis-pagos
    networks:
      - sr-network

volumes:
  pgdata_pagos:

networks:
  sr-network:
    driver: bridge