services:
  postgres:
    image: postgres:16
    container_name: styleradar-postgres
    environment:
      POSTGRES_DB: styleradar_payments
      POSTGRES_USER: sr_user
      POSTGRES_PASSWORD: sr_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sr_user -d styleradar_payments"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: styleradar-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: styleradar-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  ms-payments:
    build: .
    container_name: styleradar-ms-payments
    profiles: ["app"]
    ports:
      - "8400:8400"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8400
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/styleradar_payments
      SPRING_DATASOURCE_USERNAME: sr_user
      SPRING_DATASOURCE_PASSWORD: sr_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_SSL_ENABLED: "false"
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-TEST-MOCK}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-dev-webhook-secret}
      MP_WEBHOOK_URL: ${MP_WEBHOOK_URL:-http://localhost:8400/api/v1/webhooks/mercadopago}
      JWT_VALIDATION_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
    name: styleradar-pgdata-payments
