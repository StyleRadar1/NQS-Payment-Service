version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: styleradar-postgres
    environment:
      POSTGRES_DB: styleradar_pagos
      POSTGRES_USER: sr_user
      POSTGRES_PASSWORD: sr_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: styleradar-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: styleradar-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  ms-pagos:
    build: .
    container_name: styleradar-ms-pagos
    ports:
      - "8400:8400"
    environment:
      - SPRING_PROFILES_ACTIVE=prod 
      
      # Infraestructura local (Docker)
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/styleradar_pagos
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_RABBITMQ_HOST=rabbitmq

      - RABBITMQ_SSL=false
      - RABBITMQ_PORT=5672
      
      # Variables desde tu archivo .env
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
      - MP_ACCESS_TOKEN=${MP_ACCESS_TOKEN}
      - MP_PUBLIC_KEY=${MP_PUBLIC_KEY}
      - MP_WEBHOOK_SECRET=${MP_WEBHOOK_SECRET}
    depends_on:
      - postgres
      - redis
      - rabbitmq

volumes:
  pgdata: