spring:
  datasource:
    url: jdbc:h2:mem:styleradar_pagos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    ssl:
      enabled: false

mercadopago:
  access-token: TEST-MOCK
  public-key: TEST-MOCK
  webhook-secret: test-webhook-secret
  webhook-url: http://localhost:8400/api/v1/webhooks/mercadopago
  back-url: http://localhost:4200/suscripciones
  api:
    url: http://localhost:9999

styleradar:
  security:
    jwt:
      enabled: false
      require-token: false
  rabbit:
    enabled: false
  scheduling:
    enabled: false

management:
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false

logging:
  level:
    root: WARN
    edu.dosw.styleradar.pagos: INFO
