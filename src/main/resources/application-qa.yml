server:
  port: 8400
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:true}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5671}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL:true}
      trust-store: classpath:rabbitmq-truststore.jks
      trust-store-password: ${RABBITMQ_TRUSTSTORE_PASSWORD:changeit}
      trust-store-type: JKS
      verify-hostname: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

mercadopago:
  access-token: ${MP_ACCESS_TOKEN}
  public-key: ${MP_PUBLIC_KEY}
  webhook-secret: ${MP_WEBHOOK_SECRET}
  webhook-url: ${MP_WEBHOOK_URL:https://ms-pagos-qa.happyriver-65727909.northcentralus.azurecontainerapps.io/api/v1/webhooks/mercadopago}
  api:
    url: https://api.mercadopago.com