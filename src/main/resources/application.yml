server:
  port: ${SERVER_PORT:8400}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: ms-payments-subscriptions
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/styleradar_payments}
    username: ${SPRING_DATASOURCE_USERNAME:sr_user}
    password: ${SPRING_DATASOURCE_PASSWORD:sr_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2000ms
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 10000ms
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
      trust-store: ${RABBITMQ_TRUST_STORE:classpath:certs/rabbitmq-truststore.jks}
      trust-store-password: ${RABBITMQ_TRUSTSTORE_PASSWORD:changeit}
      trust-store-type: ${RABBITMQ_TRUST_STORE_TYPE:PKCS12}
      verify-hostname: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

mercadopago:
  access-token: ${MP_ACCESS_TOKEN:}
  public-key: ${MP_PUBLIC_KEY:}
  webhook-secret: ${MP_WEBHOOK_SECRET:}
  webhook-url: ${MP_WEBHOOK_URL:http://localhost:8400/api/v1/webhooks/mercadopago}
  back-url: ${MP_BACK_URL:http://localhost:4200/subscriptions}
  api:
    url: ${MP_API_URL:https://api.mercadopago.com}

styleradar:
  security:
    jwt:
      enabled: ${JWT_VALIDATION_ENABLED:false}
      require-token: ${JWT_REQUIRE_TOKEN:false}
      public-key: ${JWT_PUBLIC_KEY:}
      secret-base64: ${JWT_SECRET_BASE64:}
      issuer: ${JWT_ISSUER:styleradar}
  rabbit:
    enabled: ${RABBIT_ENABLED:true}
    exchange: ${RABBIT_EXCHANGE:styleradar.exchange}
    payment-confirmed-key: styleradar.pagos.pago.confirmado
    subscription-suspended-key: styleradar.pagos.suscripcion.suspendida
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:always}
      probes:
        enabled: true
  health:
    rabbit:
      enabled: ${RABBIT_ENABLED:true}
    redis:
      enabled: true

logging:
  level:
    root: INFO
    edu.dosw.styleradar.payments: ${LOG_LEVEL:INFO}
    org.springframework.amqp: WARN
