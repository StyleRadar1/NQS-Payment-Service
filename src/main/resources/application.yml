server:
  port: 8400

spring:
  application:
    name: ms-pagos-suscripciones
  datasource:
    url: jdbc:postgresql://localhost:5432/styleradar_pagos
    username: sr_user
    password: sr_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

mercadopago:
  access-token: ${MP_ACCESS_TOKEN:TEST-xxxx-xxxx}
  public-key: ${MP_PUBLIC_KEY:TEST-xxxx-xxxx}
  webhook-secret: ${MP_WEBHOOK_SECRET:secret-key-12345}
  api:
    url: https://api.mercadopago.com